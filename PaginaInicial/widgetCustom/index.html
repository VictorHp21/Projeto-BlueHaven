

<style>
 
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  .swiper {
    width: 100%;
    height: 100%;
  }

  .swiper-slide {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000; 
  }

  .swiper-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
  }
</style>

<div class="swiper">
  <div class="swiper-wrapper">
    <div class="swiper-slide">
      <img src="https://github.com/VictorHp21/Projeto-BlueHaven/blob/main/Imagens/Logo2.png?raw=true" />
    </div>
    <div class="swiper-slide">
      <img src="https://github.com/VictorHp21/Projeto-BlueHaven/blob/main/Imagens/NOVA%20COLABORADORA.png?raw=true" />
    </div>
    <div class="swiper-slide">
      <img src="https://github.com/VictorHp21/Projeto-BlueHaven/blob/main/Imagens/bluehavenCity.png?raw=true" />
    </div>
  </div>

  
  <div class="swiper-pagination"></div>

</div>

<script>
  new Swiper('.swiper', {
    loop: true,
    autoplay: { delay: 3000 },
    pagination: { el: '.swiper-pagination', clickable: true },
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev'
    },
  });
</script>
